name: Daily GBP USD check
on:
  schedule:
    - cron: "30 8 * * 1-5"   # 08:30 UTC, weekdays
  workflow_dispatch:
    inputs:
      test:
        description: "Test: open a test alert issue even if there is no signal"
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: check
        run: node scripts/check.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Open alert issue (GitHub emails you)
        if: steps.check.outputs.signal != '' || inputs.test == true
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNAL: ${{ steps.check.outputs.signal }}
          LINE: ${{ steps.check.outputs.line }}
        run: |
          TITLE="${SIGNAL:-TEST alert, no real signal}"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$LINE"
