<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GBP USD Watch</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#14202b;--mut:#5d6b78;--line:#dfe4ea;--good:#0a7d4f;--acc:#1c4e80}
@media (prefers-color-scheme:dark){:root{--bg:#0f161d;--card:#18222c;--fg:#e8eef4;--mut:#93a2b0;--line:#2a3743;--good:#4cc38a;--acc:#7db4e6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;padding:20px 16px}
main{max-width:720px;margin:0 auto;display:grid;gap:16px}
h1{font-size:1.4rem;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.mode button{border:1px solid var(--line);background:none;color:var(--fg);padding:8px 14px;cursor:pointer;font:inherit}
.mode button:first-child{border-radius:8px 0 0 8px}.mode button:last-child{border-radius:0 8px 8px 0}
.mode button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.verdict{font-size:1.25rem;font-weight:700}
.good{color:var(--good)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stats div span{display:block;color:var(--mut);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
.stats b{font-variant-numeric:tabular-nums;font-size:1.05rem}
svg{width:100%;height:auto;display:block;touch-action:pan-y;cursor:crosshair}
small{color:var(--mut)}
label{display:flex;gap:8px;align-items:center;cursor:pointer}
input[type=number]{width:110px;padding:6px 8px;font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.wrap{position:relative}
.tip{position:absolute;top:4px;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.85rem;white-space:nowrap;transform:translateX(-50%);box-shadow:0 2px 8px rgba(0,0,0,.15)}
#ctitle{font-weight:600;margin-bottom:6px}
</style>
</head>
<body>
<main>
  <h1>GBP USD Watch</h1>
  <div class="card row">
    <div class="mode" role="group" aria-label="Mode">
      <button id="m-convert" class="on">Convert USD to GBP</button><button id="m-repay">Pay back loan (GBP to USD)</button>
    </div>
    <label for="amt">Amount <input type="number" id="amt" min="1" step="1" value="100"> <span id="unitIn">USD</span></label>
  </div>
  <div class="card">
    <div id="verdict" class="verdict">Loading rates...</div>
    <small id="why"></small>
    <div style="margin-top:10px"><label><input type="checkbox" id="notify"> Alert me when this page is open</label></div>
  </div>
  <div class="card">
    <div id="ctitle"></div>
    <div class="wrap" id="wrap"><svg id="chart" viewBox="0 0 700 260" role="img" aria-label="Value of your amount over the last 6 months"></svg><div class="tip" id="tip" hidden></div></div>
    <small>Move your mouse or finger over the chart to see any day. Higher line = better for you. Dashed lines: 3-month (purple) and 6-month (orange) average.</small>
  </div>
  <div class="card stats" id="stats"></div>
  <small>Data: Frankfurter (European Central Bank rates). Not financial advice.</small>
</main>
<script>
const $ = id => document.getElementById(id);
let mode = localStorage.getItem('mode') || 'convert', S = null, G = null;
let amt = Number(localStorage.getItem('amt')) || 100;
const unitIn = () => mode === 'convert' ? 'USD' : 'GBP';
const unitOut = () => mode === 'convert' ? 'GBP' : 'USD';
const val = r => mode === 'convert' ? amt / r : amt * r;
const fmt = n => n.toLocaleString('en-GB', {minimumFractionDigits: 2, maximumFractionDigits: 2});

function stats(rows){
  const v = rows.map(r => r[1]), avg = a => a.reduce((x,y)=>x+y,0)/a.length;
  const cut = new Date(); cut.setMonth(cut.getMonth()-3);
  const v3 = rows.filter(r => new Date(r[0]) >= cut).map(r => r[1]);
  const today = v[v.length-1], min = Math.min(...v), max = Math.max(...v);
  return {today, avg3: avg(v3), avg6: avg(v), min, max, pos: (today-min)/(max-min)};
}
function verdict(s, m){
  if(m === 'convert'){
    const ok = s.pos <= .25 && s.today < s.avg3 && s.today < s.avg6;
    return {ok, text: ok ? 'Good time to convert USD to GBP' : 'Not a special time. Wait.',
      why: ok ? 'You get more pounds than usual: top 25% of 6 months and above both averages.' : 'Wait until you get more pounds per dollar: top 25% of 6 months and above both averages.'};
  }
  const ok = s.pos >= .75 && s.today > s.avg3 && s.today > s.avg6;
  return {ok, text: ok ? 'Good time to pay back your loan' : 'Not a special time. Wait.',
    why: ok ? 'You get more dollars than usual: top 25% of 6 months and above both averages.' : 'Wait until you get more dollars per pound: top 25% of 6 months and above both averages.'};
}
function render(){
  if(!S) return;
  const s = S.s, v = verdict(s, mode), out = unitOut();
  $('verdict').textContent = v.text; $('verdict').className = 'verdict ' + (v.ok ? 'good' : '');
  $('why').textContent = v.why;
  $('m-convert').classList.toggle('on', mode==='convert'); $('m-repay').classList.toggle('on', mode==='repay');
  $('unitIn').textContent = unitIn();
  const vals = S.rows.map(r => val(r[1])), best = Math.max(...vals), worst = Math.min(...vals);
  const score = Math.round((mode === 'convert' ? 1 - s.pos : s.pos) * 100);
  const c = n => fmt(n) + ' ' + out;
  $('stats').innerHTML = [['Today', c(val(s.today))],['3-month average', c(val(s.avg3))],['6-month average', c(val(s.avg6))],
    ['6-month best', c(best)],['6-month worst', c(worst)],['Score today', score + '% (100% = best)']]
    .map(x => '<div><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');
  $('ctitle').textContent = fmt(amt) + ' ' + unitIn() + ' gets you this many ' + out + ', day by day';
  draw();
  if($('notify').checked && v.ok && 'Notification' in window && Notification.permission === 'granted'){
    const key = new Date().toDateString()+mode;
    if(localStorage.getItem('last') !== key){ localStorage.setItem('last', key); new Notification('GBP/USD '+s.today.toFixed(4), {body: v.text}); }
  }
}
function draw(){
  const r = S.rows, s = S.s, W=700, H=260, p=40, n = r.length;
  const v = r.map(a => val(a[1]));
  const mn = Math.min(...v), mx = Math.max(...v), pad = (mx-mn)*0.1 || 0.01;
  const lo = mn - pad, hi = mx + pad;
  const x = i => p + i*(W-2*p)/(n-1), y = q => H-p - (q-lo)/(hi-lo)*(H-2*p);
  G = {x, y, v, W, n, p};
  const pts = v.map((q,i)=>x(i).toFixed(1)+','+y(q).toFixed(1)).join(' ');
  const line = (q,c) => '<line x1="'+p+'" x2="'+(W-p)+'" y1="'+y(q)+'" y2="'+y(q)+'" stroke="'+c+'" stroke-dasharray="5 4"/>';
  $('chart').innerHTML =
    '<line x1="'+p+'" x2="'+(W-p)+'" y1="'+y(mx)+'" y2="'+y(mx)+'" stroke="var(--line)"/>'+
    '<line x1="'+p+'" x2="'+(W-p)+'" y1="'+y(mn)+'" y2="'+y(mn)+'" stroke="var(--line)"/>'+
    '<text x="2" y="'+(y(mx)+4)+'" font-size="11" fill="currentColor">'+fmt(mx)+'</text>'+
    '<text x="2" y="'+(y(mn)+4)+'" font-size="11" fill="currentColor">'+fmt(mn)+'</text>'+
    line(val(s.avg6),'#d98a00')+line(val(s.avg3),'#8a5cd6')+
    '<polyline fill="none" stroke="var(--acc)" stroke-width="2" points="'+pts+'"/>'+
    '<line id="vl" y1="'+p/2+'" y2="'+(H-p)+'" stroke="var(--mut)" stroke-dasharray="2 3"/>'+
    '<circle id="dot" r="5" fill="var(--acc)" stroke="var(--card)" stroke-width="2"/>'+
    '<text x="'+p+'" y="'+(H-10)+'" font-size="11" fill="currentColor">'+r[0][0]+'</text>'+
    '<text x="'+(W-p)+'" y="'+(H-10)+'" font-size="11" text-anchor="end" fill="currentColor">'+r[n-1][0]+'</text>';
  show(n-1);
}
function show(i){
  if(!G || !S) return;
  const r = S.rows, v = G.v, last = v[v.length-1], d = v[i]-last;
  const px = G.x(i), py = G.y(v[i]);
  const vl = $('vl'), dot = $('dot');
  vl.setAttribute('x1', px); vl.setAttribute('x2', px);
  dot.setAttribute('cx', px); dot.setAttribute('cy', py);
  const w = $('wrap').clientWidth, left = Math.min(Math.max(px / G.W * w, 100), w - 100);
  const tip = $('tip'); tip.hidden = false; tip.style.left = left + 'px';
  const diff = i === v.length-1 ? 'today' : (d >= 0 ? '+' : '') + fmt(d) + ' ' + unitOut() + ' vs today';
  tip.innerHTML = '<b>' + r[i][0] + '</b><br>' + fmt(amt) + ' ' + unitIn() + ' = <b>' + fmt(v[i]) + ' ' + unitOut() + '</b><br><small>' + diff + '</small>';
}
function pick(e){
  if(!G) return;
  const box = $('chart').getBoundingClientRect();
  const xr = (e.clientX - box.left) / box.width * G.W;
  let i = Math.round((xr - G.p) / (G.W - 2*G.p) * (G.n - 1));
  show(Math.max(0, Math.min(G.n - 1, i)));
}
async function load(){
  const end = new Date(), start = new Date(); start.setMonth(start.getMonth()-6);
  const d = x => x.toISOString().slice(0,10);
  try{
    const res = await fetch('https://api.frankfurter.dev/v1/'+d(start)+'..'+d(end)+'?base=GBP&symbols=USD');
    const j = await res.json();
    const rows = Object.entries(j.rates).map(([k,v]) => [k, v.USD]).sort();
    S = {rows, s: stats(rows)}; render();
  }catch(e){ $('verdict').textContent = 'Could not load rates. Refresh the page.'; }
}
$('amt').value = amt;
$('amt').oninput = e => { const n = Number(e.target.value); if(n > 0){ amt = n; localStorage.setItem('amt', n); render(); } };
$('m-convert').onclick = () => { mode='convert'; localStorage.setItem('mode',mode); render(); };
$('m-repay').onclick = () => { mode='repay'; localStorage.setItem('mode',mode); render(); };
$('notify').onchange = async e => { if(e.target.checked && 'Notification' in window) await Notification.requestPermission(); render(); };
$('chart').addEventListener('pointermove', pick);
$('chart').addEventListener('pointerdown', pick);
$('chart').addEventListener('pointerleave', () => { if(G) show(G.n-1); });
load(); setInterval(load, 3600000);
</script>
</body>
</html>
